spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/volunteerhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:vh_user}
    password: ${SPRING_DATASOURCE_PASSWORD:vh_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  file:
    upload-dir: uploads
    max-size-bytes: 5242880
    allowed-types: image/png,image/jpeg,image/webp,image/gif

webpush:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY}
    private-key: ${VAPID_PRIVATE_KEY}
    subject: ${VAPID_SUBJECT:mailto:admin@vh.test}

jwt:
  secret: ${JWT_SECRET}
  expirationMs: ${JWT_EXP_MS:3600000}

server:
  port: 8080

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG